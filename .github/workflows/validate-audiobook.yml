name: Validate Audiobook Pipeline

on:
  push:
    branches: [main]
    paths:
      - 'audiobook/**'
      - 'book-01/draft-v3/**'
      - '.github/workflows/validate-audiobook.yml'
  pull_request:
    paths:
      - 'audiobook/**'
      - 'book-01/draft-v3/**'
      - '.github/workflows/validate-audiobook.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile scripts
        run: python -m py_compile audiobook/scripts/*.py
      - name: Prepare and validate narrator manifest
        run: |
          python audiobook/scripts/prepare_manuscript.py --voice-mode narrator
          python audiobook/scripts/validate_manifest.py
      - name: Prepare and validate POV manifest
        run: |
          python audiobook/scripts/prepare_manuscript.py --voice-mode pov
          python audiobook/scripts/validate_manifest.py
      - name: Run unit tests
        run: python -m unittest discover -s audiobook/tests -v

